<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- For the checks on GitHub (.github/workflows/checks.yml). The made-up scans are drawn with whatever font the computer
     gives for "monospace", and the scan tests were measured with DejaVu Sans Mono. This asks for the same one there. -->
<fontconfig>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>Consolas</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
