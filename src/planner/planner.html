}

.ls-trule{left:254px;top:369px;width:907px}

.ls-shape{position:absolute}
.ls-bx{position:absolute;display:flex;flex-direction:column;line-height:1.2;overflow:hidden}
.rt{position:relative;min-height:1.2em}

/* ---------- Planner ---------- */
